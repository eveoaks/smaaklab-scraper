name: Scrape Supermarkt Deals

on:
  schedule:
    - cron: '0 6 * * 1'  # Elke maandag 06:00 UTC (08:00 NL zomertijd)
  workflow_dispatch:      # Handmatig triggeren via GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape deals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python supermarkt_scraper.py

      - name: Commit deals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json deals_viewer.html
          git diff --staged --quiet || git commit -m "chore: supermarkt deals $(date +%Y-%m-%d)"
          git push
